<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUUA — Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/museo-styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: var(--gris-claro);
        }

        header .header-title { margin-left: 0; }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .login-container {
            display: flex;
            width: 100%;
            max-width: 860px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            border-radius: 4px;
            overflow: hidden;
        }

        .login-panel-left {
            background: var(--verde-principal);
            color: var(--blanco);
            padding: 48px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
        }

        .login-panel-left .muua-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2.8rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1;
        }

        .login-panel-left .muua-sub {
            font-size: 0.78rem;
            color: var(--verde-lima);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        .login-divider {
            width: 48px;
            height: 2px;
            background: var(--verde-lima);
            margin: 8px 0;
        }

        .login-desc {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.75);
            font-weight: 300;
            line-height: 1.6;
            max-width: 260px;
        }

        .login-panel-right {
            background: var(--blanco);
            padding: 48px 40px;
            width: 340px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-panel-right h2 {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.3rem;
            color: var(--verde-principal);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .login-welcome {
            font-size: 0.8rem;
            color: var(--gris-texto);
            margin-bottom: 28px;
        }

        .login-panel-right .form-group {
            margin-bottom: 16px;
        }

        .login-panel-right label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--verde-principal);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
            margin-bottom: 6px;
        }

        .login-panel-right input {
            width: 100%;
            padding: 10px 13px;
            border: 1px solid var(--gris-medio);
            border-radius: 3px;
            font-size: 0.9rem;
            font-family: 'Roboto', sans-serif;
            color: var(--negro);
            background: var(--blanco);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .login-panel-right input:focus {
            border-color: var(--verde-principal);
            box-shadow: 0 0 0 3px rgba(2,105,55,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background: var(--verde-principal);
            color: var(--blanco);
            border: none;
            border-radius: 3px;
            font-family: 'Roboto', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn-login:hover { background: var(--verde-medio); }
        .btn-login:active { transform: scale(0.98); }

        .login-error {
            background: #ffebee;
            color: #c62828;
            border-left: 3px solid #c62828;
            border-radius: 3px;
            padding: 10px 14px;
            font-size: 0.83rem;
            margin-bottom: 18px;
            display: none;
            line-height: 1.4;
        }

        footer { margin-left: 0; }

        @media (max-width: 640px) {
            .login-panel-left { display: none; }
            .login-panel-right { width: 100%; padding: 36px 28px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">
        Sistema de Trazabilidad
        <span>Museo Universitario — MUUA</span>
    </div>
</header>

<div class="login-wrapper">
    <div class="login-container">

        <div class="login-panel-left">
            <div class="muua-title">MUUA</div>
            <div class="muua-sub">
                Museo Universitario<br>
                Universidad de Antioquia
            </div>
            <div class="login-divider"></div>
            <p class="login-desc">
                Sistema de trazabilidad para la gestión y seguimiento
                del patrimonio artístico del museo.
            </p>
        </div>

        <div class="login-panel-right">
            <h2>Iniciar Sesión</h2>
            <p class="login-welcome">Ingrese sus credenciales para continuar</p>

            <div class="login-error" id="login-error"></div>

            <form onsubmit="submitLogin(event)">
                <div class="form-group">
                    <label>Correo institucional</label>
                    <input type="email" id="login-email"
                           placeholder="usuario@udea.edu.co" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password"
                           placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>
        </div>

    </div>
</div>

<footer>
    <div class="footer-logo">
        <img src="images/logo_udea.png" alt="Universidad de Antioquia">
    </div>
    <div class="footer-divider"></div>
    <div class="footer-logo">
        <img src="images/logo_facultad_ingenieria.png" alt="Facultad de Ingeniería">
    </div>
    <div class="footer-divider"></div>
    <div class="footer-muua">
        <div class="muua-name">MUUA</div>
        <div class="muua-sub">Museo Universitario<br>Universidad de Antioquia</div>
    </div>
</footer>

<script>
    const API = '/api';

    if (sessionStorage.getItem('museo_token')) {
        window.location.href = 'index.html';
    }

    async function submitLogin(e) {
        e.preventDefault();
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';

        const email    = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
            const res = await fetch(API + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.error || 'Credenciales inválidas';
                errorEl.style.display = 'block';
                return;
            }

            sessionStorage.setItem('museo_token',  data.token);
            sessionStorage.setItem('museo_rol',    data.rol);
            sessionStorage.setItem('museo_nombre', `${data.nombre} ${data.apellido}`);

            window.location.href = 'index.html';

        } catch (err) {
            errorEl.textContent = 'Error de conexión. Intente nuevamente.';
            errorEl.style.display = 'block';
        }
    }
</script>

</body>
</html>
